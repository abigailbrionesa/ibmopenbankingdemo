<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorize Application - IBM Open Banking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f4f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-size: 14px;
      line-height: 1.5;
      color: #161616;
    }

    .consent-container {
      background: white;
      border-radius: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      max-width: 672px;
      width: 100%;
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }

    .consent-header {
      background: #0f62fe;
      color: white;
      padding: 2rem;
      border-bottom: 1px solid #0353e9;
    }

    .consent-header h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .consent-header p {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
    }

    .consent-body {
      padding: 2rem;
    }

    .app-info {
      display: flex;
      align-items: center;
      padding: 1.5rem;
      background: #f4f4f4;
      border-radius: 0;
      margin-bottom: 2rem;
      border: 1px solid #e0e0e0;
    }

    .app-logo {
      width: 64px;
      height: 64px;
      border-radius: 0;
      background: #0f62fe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      color: white;
      margin-right: 1.5rem;
      flex-shrink: 0;
    }

    .app-details h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #161616;
      margin-bottom: 0.25rem;
    }

    .app-details p {
      font-size: 14px;
      color: #525252;
    }

    .customer-info {
      background: #e8e8e8;
      padding: 1rem 1.5rem;
      border-radius: 0;
      margin-bottom: 2rem;
      font-size: 14px;
      color: #525252;
      border-left: 4px solid #0f62fe;
    }

    .customer-info strong {
      color: #161616;
      font-weight: 600;
    }

    .permissions-section h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: #161616;
      margin-bottom: 1rem;
    }

    .permission-item {
      display: flex;
      align-items: flex-start;
      padding: 1rem;
      background: #ffffff;
      border-left: 4px solid #0f62fe;
      border-radius: 0;
      margin-bottom: 0.75rem;
      border: 1px solid #e0e0e0;
      border-left: 4px solid #0f62fe;
    }

    .permission-icon {
      width: 20px;
      height: 20px;
      background: #0f62fe;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
      margin-right: 1rem;
      flex-shrink: 0;
    }

    .permission-content h4 {
      font-size: 14px;
      font-weight: 600;
      color: #161616;
      margin-bottom: 0.25rem;
    }

    .permission-content p {
      font-size: 14px;
      color: #525252;
      line-height: 1.5;
    }

    .existing-consent {
      background: #fff8e1;
      border: 1px solid #f1c21b;
      border-radius: 0;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      border-left: 4px solid #f1c21b;
    }

    .existing-consent h4 {
      color: #161616;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
    }

    .existing-consent h4::before {
      content: "Info:";
      margin-right: 0.5rem;
      font-weight: 700;
    }

    .existing-consent p {
      font-size: 14px;
      color: #525252;
      line-height: 1.5;
    }

    .consent-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn {
      flex: 1;
      padding: 0.875rem 1rem;
      border: none;
      border-radius: 0;
      font-size: 14px;
      font-weight: 400;
      font-family: 'IBM Plex Sans', sans-serif;
      cursor: pointer;
      transition: background 0.11s cubic-bezier(0.2, 0, 0.38, 0.9);
      min-height: 48px;
    }

    .btn-approve {
      background: #0f62fe;
      color: white;
    }

    .btn-approve:hover {
      background: #0353e9;
    }

    .btn-deny {
      background: white;
      color: #161616;
      border: 1px solid #8d8d8d;
    }

    .btn-deny:hover {
      background: #e8e8e8;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .security-notice {
      margin-top: 2rem;
      padding: 1rem;
      background: #e8e8e8;
      border-radius: 0;
      font-size: 12px;
      color: #525252;
      line-height: 1.6;
      border-left: 4px solid #0f62fe;
    }

    .security-notice strong {
      color: #161616;
      font-weight: 600;
    }

    .links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 14px;
    }

    .links a {
      color: #0f62fe;
      text-decoration: none;
      margin: 0 1rem;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      padding: 2.5rem;
      color: #525252;
    }

    .error {
      background: #fff1f1;
      border: 1px solid #da1e28;
      border-left: 4px solid #da1e28;
      color: #161616;
      padding: 1rem 1.5rem;
      border-radius: 0;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 640px) {
      .consent-actions {
        flex-direction: column-reverse;
      }

      .app-info {
        flex-direction: column;
        text-align: center;
      }

      .app-logo {
        margin-right: 0;
        margin-bottom: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="consent-container">
    <div class="consent-header">
      <h1>Authorization Request</h1>
      <p>Review and approve access to your banking data</p>
    </div>

    <div class="consent-body" id="consentBody">
      <div class="loading">
        <p>Loading authorization request...</p>
      </div>
    </div>
  </div>

  <script>
    // Get auth_request_id from URL
    const urlParams = new URLSearchParams(window.location.search);
    const authRequestId = urlParams.get('auth_request_id');

    if (!authRequestId) {
      showError('Missing authorization request ID');
    } else {
      loadConsentPage();
    }

    async function loadConsentPage() {
      try {
        const response = await fetch(`/api/consent/page?auth_request_id=${authRequestId}`, {
          credentials: 'include'
        });

        const data = await response.json();

        if (!data.success) {
          showError(data.error_description || 'Failed to load consent page');
          return;
        }

        renderConsentPage(data);
      } catch (error) {
        showError('Failed to load consent page: ' + error.message);
      }
    }

    function renderConsentPage(data) {
      const { client, customer, requested_scopes, scope_descriptions, existing_consent } = data;

      const html = `
        ${existing_consent ? `
          <div class="existing-consent">
            <h4>You've already authorized this application</h4>
            <p>
              You granted access on ${new Date(existing_consent.approved_at).toLocaleDateString()}.
              This authorization expires on ${new Date(existing_consent.expires_at).toLocaleDateString()}.
              Approving again will use your existing consent.
            </p>
          </div>
        ` : ''}

        <div class="app-info">
          <div class="app-logo">
            ${client.logo_uri ? `<img src="${client.logo_uri}" alt="${client.name}" style="width: 100%; height: 100%; object-fit: cover;">` : 'APP'}
          </div>
          <div class="app-details">
            <h2>${escapeHtml(client.name)}</h2>
            <p>${escapeHtml(client.description || 'Third-party application')}</p>
          </div>
        </div>

        <div class="customer-info">
          Logged in as: <strong>${escapeHtml(customer.name)}</strong> (${escapeHtml(customer.email)})
        </div>

        <div class="permissions-section">
          <h3>This application will be able to:</h3>
          ${requested_scopes.map(scope => {
            const desc = scope_descriptions[scope];
            return `
              <div class="permission-item">
                <div class="permission-icon">✓</div>
                <div class="permission-content">
                  <h4>${escapeHtml(desc.title)}</h4>
                  <p>${escapeHtml(desc.description)}</p>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="consent-actions">
          <button class="btn btn-deny" onclick="handleDeny()">Deny</button>
          <button class="btn btn-approve" onclick="handleApprove()">Approve</button>
        </div>

        <div class="security-notice">
          <strong>Your data is protected</strong><br>
          You can revoke this authorization at any time from your account settings.
          This consent will expire in 90 days and will need to be renewed.
        </div>

        ${client.policy_uri || client.tos_uri ? `
          <div class="links">
            ${client.policy_uri ? `<a href="${client.policy_uri}" target="_blank">Privacy Policy</a>` : ''}
            ${client.tos_uri ? `<a href="${client.tos_uri}" target="_blank">Terms of Service</a>` : ''}
          </div>
        ` : ''}
      `;

      document.getElementById('consentBody').innerHTML = html;
    }

    async function handleApprove() {
      await submitDecision('approve');
    }

    async function handleDeny() {
      await submitDecision('deny');
    }

    async function submitDecision(action) {
      // Disable buttons
      const buttons = document.querySelectorAll('.btn');
      buttons.forEach(btn => btn.disabled = true);

      try {
        const response = await fetch('/api/consent/decision', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({
            auth_request_id: authRequestId,
            action: action
          })
        });

        const data = await response.json();

        if (data.success) {
          // Redirect with authorization code
          const redirectUrl = new URL(data.redirect_uri);
          redirectUrl.searchParams.set('code', data.code);
          if (data.state) {
            redirectUrl.searchParams.set('state', data.state);
          }
          window.location.href = redirectUrl.toString();
        } else {
          // Redirect with error
          if (data.should_redirect) {
            const redirectUrl = new URL(data.redirect_uri);
            redirectUrl.searchParams.set('error', data.error);
            redirectUrl.searchParams.set('error_description', data.error_description);
            if (data.state) {
              redirectUrl.searchParams.set('state', data.state);
            }
            window.location.href = redirectUrl.toString();
          } else {
            showError(data.error_description || 'Failed to process consent');
            buttons.forEach(btn => btn.disabled = false);
          }
        }
      } catch (error) {
        showError('Failed to submit decision: ' + error.message);
        buttons.forEach(btn => btn.disabled = false);
      }
    }

    function showError(message) {
      document.getElementById('consentBody').innerHTML = `
        <div class="error">
          <strong>Error:</strong> ${escapeHtml(message)}
        </div>
        <div style="text-align: center; margin-top: 20px;">
          <a href="/auth/login" style="color: #667eea; text-decoration: none;">Return to Login</a>
        </div>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
