<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorize Application - Open Banking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .consent-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
    }

    .consent-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .consent-header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .consent-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .consent-body {
      padding: 30px;
    }

    .app-info {
      display: flex;
      align-items: center;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    .app-logo {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #667eea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      margin-right: 20px;
      flex-shrink: 0;
    }

    .app-details h2 {
      font-size: 20px;
      color: #2d3748;
      margin-bottom: 4px;
    }

    .app-details p {
      font-size: 14px;
      color: #718096;
    }

    .customer-info {
      background: #edf2f7;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      font-size: 14px;
      color: #4a5568;
    }

    .customer-info strong {
      color: #2d3748;
    }

    .permissions-section h3 {
      font-size: 18px;
      color: #2d3748;
      margin-bottom: 15px;
    }

    .permission-item {
      display: flex;
      align-items: flex-start;
      padding: 15px;
      background: #f7fafc;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .permission-icon {
      width: 24px;
      height: 24px;
      background: #667eea;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      margin-right: 15px;
      flex-shrink: 0;
    }

    .permission-content h4 {
      font-size: 15px;
      color: #2d3748;
      margin-bottom: 4px;
    }

    .permission-content p {
      font-size: 13px;
      color: #718096;
      line-height: 1.5;
    }

    .existing-consent {
      background: #fef5e7;
      border: 1px solid #f39c12;
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 20px;
    }

    .existing-consent h4 {
      color: #d68910;
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }

    .existing-consent h4::before {
      content: "ℹ️";
      margin-right: 8px;
    }

    .existing-consent p {
      font-size: 13px;
      color: #7d6608;
      line-height: 1.5;
    }

    .consent-actions {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-approve {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-approve:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-deny {
      background: white;
      color: #e53e3e;
      border: 2px solid #e53e3e;
    }

    .btn-deny:hover {
      background: #e53e3e;
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .security-notice {
      margin-top: 30px;
      padding: 15px;
      background: #f0f4f8;
      border-radius: 8px;
      font-size: 12px;
      color: #4a5568;
      line-height: 1.6;
    }

    .security-notice strong {
      color: #2d3748;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
    }

    .links a {
      color: #667eea;
      text-decoration: none;
      margin: 0 10px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #718096;
    }

    .error {
      background: #fed7d7;
      border: 1px solid #fc8181;
      color: #c53030;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    @media (max-width: 640px) {
      .consent-actions {
        flex-direction: column-reverse;
      }

      .app-info {
        flex-direction: column;
        text-align: center;
      }

      .app-logo {
        margin-right: 0;
        margin-bottom: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="consent-container">
    <div class="consent-header">
      <h1>🔐 Authorization Request</h1>
      <p>Review and approve access to your banking data</p>
    </div>

    <div class="consent-body" id="consentBody">
      <div class="loading">
        <p>Loading authorization request...</p>
      </div>
    </div>
  </div>

  <script>
    // Get auth_request_id from URL
    const urlParams = new URLSearchParams(window.location.search);
    const authRequestId = urlParams.get('auth_request_id');

    if (!authRequestId) {
      showError('Missing authorization request ID');
    } else {
      loadConsentPage();
    }

    async function loadConsentPage() {
      try {
        const response = await fetch(`/api/consent/page?auth_request_id=${authRequestId}`, {
          credentials: 'include'
        });

        const data = await response.json();

        if (!data.success) {
          showError(data.error_description || 'Failed to load consent page');
          return;
        }

        renderConsentPage(data);
      } catch (error) {
        showError('Failed to load consent page: ' + error.message);
      }
    }

    function renderConsentPage(data) {
      const { client, customer, requested_scopes, scope_descriptions, existing_consent } = data;

      const html = `
        ${existing_consent ? `
          <div class="existing-consent">
            <h4>You've already authorized this application</h4>
            <p>
              You granted access on ${new Date(existing_consent.approved_at).toLocaleDateString()}.
              This authorization expires on ${new Date(existing_consent.expires_at).toLocaleDateString()}.
              Approving again will use your existing consent.
            </p>
          </div>
        ` : ''}

        <div class="app-info">
          <div class="app-logo">
            ${client.logo_uri ? `<img src="${client.logo_uri}" alt="${client.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;">` : '🏦'}
          </div>
          <div class="app-details">
            <h2>${escapeHtml(client.name)}</h2>
            <p>${escapeHtml(client.description || 'Third-party application')}</p>
          </div>
        </div>

        <div class="customer-info">
          Logged in as: <strong>${escapeHtml(customer.name)}</strong> (${escapeHtml(customer.email)})
        </div>

        <div class="permissions-section">
          <h3>This application will be able to:</h3>
          ${requested_scopes.map(scope => {
            const desc = scope_descriptions[scope];
            return `
              <div class="permission-item">
                <div class="permission-icon">✓</div>
                <div class="permission-content">
                  <h4>${escapeHtml(desc.title)}</h4>
                  <p>${escapeHtml(desc.description)}</p>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="consent-actions">
          <button class="btn btn-deny" onclick="handleDeny()">Deny</button>
          <button class="btn btn-approve" onclick="handleApprove()">Approve</button>
        </div>

        <div class="security-notice">
          <strong>🔒 Your data is protected</strong><br>
          You can revoke this authorization at any time from your account settings.
          This consent will expire in 90 days and will need to be renewed.
        </div>

        ${client.policy_uri || client.tos_uri ? `
          <div class="links">
            ${client.policy_uri ? `<a href="${client.policy_uri}" target="_blank">Privacy Policy</a>` : ''}
            ${client.tos_uri ? `<a href="${client.tos_uri}" target="_blank">Terms of Service</a>` : ''}
          </div>
        ` : ''}
      `;

      document.getElementById('consentBody').innerHTML = html;
    }

    async function handleApprove() {
      await submitDecision('approve');
    }

    async function handleDeny() {
      await submitDecision('deny');
    }

    async function submitDecision(action) {
      // Disable buttons
      const buttons = document.querySelectorAll('.btn');
      buttons.forEach(btn => btn.disabled = true);

      try {
        const response = await fetch('/api/consent/decision', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({
            auth_request_id: authRequestId,
            action: action
          })
        });

        const data = await response.json();

        if (data.success) {
          // Redirect with authorization code
          const redirectUrl = new URL(data.redirect_uri);
          redirectUrl.searchParams.set('code', data.code);
          if (data.state) {
            redirectUrl.searchParams.set('state', data.state);
          }
          window.location.href = redirectUrl.toString();
        } else {
          // Redirect with error
          if (data.should_redirect) {
            const redirectUrl = new URL(data.redirect_uri);
            redirectUrl.searchParams.set('error', data.error);
            redirectUrl.searchParams.set('error_description', data.error_description);
            if (data.state) {
              redirectUrl.searchParams.set('state', data.state);
            }
            window.location.href = redirectUrl.toString();
          } else {
            showError(data.error_description || 'Failed to process consent');
            buttons.forEach(btn => btn.disabled = false);
          }
        }
      } catch (error) {
        showError('Failed to submit decision: ' + error.message);
        buttons.forEach(btn => btn.disabled = false);
      }
    }

    function showError(message) {
      document.getElementById('consentBody').innerHTML = `
        <div class="error">
          <strong>Error:</strong> ${escapeHtml(message)}
        </div>
        <div style="text-align: center; margin-top: 20px;">
          <a href="/auth/login" style="color: #667eea; text-decoration: none;">Return to Login</a>
        </div>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
